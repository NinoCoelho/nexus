<!DOCTYPE html>
<html lang="en" data-theme="mermaidcore">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header id="hdr">
  <div id="hdrTop">
    <button id="botChip" title="Switch bot, chat or team">
      <span id="botAvatar"></span>
      <span id="botName">Nexus</span>
      <span class="chip-caret">▾</span>
    </button>
    <div id="hdrBtns">
      <button id="btnGrant" hidden title="Allow reading pages you haven't clicked the icon on">Grant page access</button>
      <button id="btnGroup" hidden title="Add this tab to the Nexus tab group — grouped tabs become shared context">＋ Group</button>
      <span id="groupBadge" hidden></span>
      <button id="btnNew" title="Start a new conversation for this tab">New</button>
      <button id="btnStop" hidden title="Cancel the running turn">Stop</button>
    </div>
  </div>
  <div id="teamStrip" hidden></div>
  <div id="pageInfo">
    <div id="pageTitle" title="">No page</div>
    <div id="pageUrl"></div>
  </div>
</header>
<div id="statusBar" hidden></div>
<main id="msgs"></main>
<div id="activityWrap" hidden>
  <div id="activityBar"></div>
</div>
<footer id="composer">
  <div id="queueBar" hidden></div>
  <div id="mentionPop" hidden></div>
  <div id="modelPop" hidden></div>
  <div id="inputWrap">
    <textarea id="input" rows="3" placeholder="Ask about this page… (@ to mention a bot)"></textarea>
    <button id="modelChip" hidden title="Model for this chat"></button>
  </div>
  <div id="composerBtns">
    <button id="btnForward" title="Forward this conversation to a bot">→</button>
    <button id="btnSend" title="Send (Enter)">Send</button>
  </div>
</footer>
<script src="vendor/marked.min.js"></script>
<script type="module" src="panel.js"></script>
</body>
</html>
